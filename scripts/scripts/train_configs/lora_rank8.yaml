model:
  name: "sd_v1.5_pruned"
  path: "/models/checkpoints/sd_v1.5_pruned.safetensors"

train:
  output_dir: "/models/lora"
  output_name: "badayaoxiang_rank8"
  train_data_dir: "/dataset/train"
  resolution: 512
  batch_size: 1
  max_train_epochs: 20
  optimizer:
    type: "AdamW8bit"
    learning_rate: 1.0e-4
    lr_scheduler: "constant"
  precision: "fp16"
  seed: 1337

lora:
  network_dim: 8
  network_alpha: 1.0
